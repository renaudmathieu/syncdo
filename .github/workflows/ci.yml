name: CI

# Builds and tests the published libraries and the sample on every pull request and on
# main. The Linux job covers the JVM and Android targets (including apiCheck); the macOS
# job runs the iOS simulator tests of the two libraries.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Libraries (tests, apiCheck, Android lint)
        run: ./gradlew :crdt:check :sync:check
      - name: Sample (JVM tests)
        run: ./gradlew :shared:jvmTest :server:test
      - name: Sample app compiles (desktop and Android)
        run: ./gradlew :composeApp:jvmJar :composeApp:assembleDebug

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Library iOS simulator tests
        run: ./gradlew :crdt:iosSimulatorArm64Test :sync:iosSimulatorArm64Test

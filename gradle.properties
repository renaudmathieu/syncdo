#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Publishing
GROUP=com.doppio.syncdo
VERSION_NAME=0.1.0-SNAPSHOT
# AGP 8.13 recommends compileSdk 36 at most; :composeApp needs 37 for io.github.kyant0:backdrop
android.suppressUnsupportedCompileSdk=37

# Dokka 2 Gradle plugin (DSL used in the build files)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
